[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "five-hour-pinger"
version = "1.0.0"
description = "Scheduled tiny warm-up requests for Claude Code and Codex CLI"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
pinger = "pinger:main"

[tool.setuptools]
py-modules = ["pinger"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["smoke: quick offline checks"]
